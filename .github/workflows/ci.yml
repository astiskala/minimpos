name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Gradle daemon runs on JDK 21 (gradle/gradle-daemon-jvm.properties); providing it avoids a download.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Quality gate
        run: |
          # Use the runner image's browser; helper pages themselves make no network requests.
          MINIMPOS_CHROME="$(command -v google-chrome)"
          export MINIMPOS_CHROME
          ./gradlew qualityGate --continue

      - name: Release build (R8)
        run: ./gradlew :app:assembleRelease -PqualityGatePassed=true

      # Only main's successful CI may supply an APK to the signing workflow.
      - name: Prepare unsigned release artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p build/release-artifact
          cp app/build/outputs/apk/release/app-release-unsigned.apk build/release-artifact/
          cp tooling/build/libs/minimpos-tooling.jar build/release-artifact/
          java -jar tooling/build/libs/minimpos-tooling.jar release manifest --artifact build/release-artifact \
            --commit "$COMMIT" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"

      - name: Upload unsigned release artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: build/release-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            */build/reports/
            */build/test-results/
          retention-days: 14
