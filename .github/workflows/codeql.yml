name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: matrix.language == 'java-kotlin'
        with:
          # Analysis may reuse dependencies, but must not replace the CI build/test cache.
          cache-read-only: true

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Compile every production module for Kotlin extraction
        if: matrix.language == 'java-kotlin'
        # Compiler execution is required for extraction. Do not restore compilation or skip it as up to date.
        # Packaging, D8, R8 and tests remain in CI, not this security-only build.
        run: >-
          ./gradlew :core:classes :adyen:classes :tooling:classes :website-test:classes
          :app:compileDebugKotlin :app:compileDebugJavaWithJavac
          --no-build-cache --no-configuration-cache --rerun-tasks

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
