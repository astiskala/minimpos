name: Dependency submission

# Sends the resolved Gradle dependency graph, transitive dependencies included, to GitHub, so that Dependabot alerts on
# advisories in libraries no build file declares (the `patched` table in settings.gradle.kts handles those).
on:
  push:
    branches: [main]
    paths:
      - '*.gradle.kts'
      - '*/build.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/dependency-submission.yml'
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
