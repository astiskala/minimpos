name: Release

# Prepare a version-only commit, run CI (or reuse exact successful main CI), then sign its APK without rebuilding it.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to raise, or resume an unpublished version commit
        type: choice
        options: [patch, minor, major, resume]
        default: patch
      notes:
        description: Merchant-facing English Markdown bullets (see CONTRIBUTING release-note style)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      previous: ${{ steps.version.outputs.previous }}
      run: ${{ steps.reuse.outputs.run }}
      attempt: ${{ steps.reuse.outputs.attempt }}
    steps:
      - name: Require authored release notes before preparing a version
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          if [[ ! "$RELEASE_NOTES" =~ [^[:space:]] ]]; then
              printf '%s\n' "::error::Supply merchant-facing release notes following CONTRIBUTING.md."
              exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Build release tooling without signing credentials
        run: ./gradlew :tooling:cliJar --console=plain

      - name: Prepare the version commit
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$(git rev-parse HEAD)" ]]; then
              printf '%s\n' "::error::Main advanced after this workflow was selected. Run Release on current main."
              exit 1
          fi
          previous=$(gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name)
          name=$(sed -n 's/^versionName=//p' version.properties)
          version_commit=$(git log -1 --format=%H -- version.properties)
          subject=$(git log -1 --format=%s "$version_commit")
          files=$(git diff-tree --no-commit-id --name-only -r "$version_commit")
          if [[ "$BUMP" == resume ]]; then
              java -jar tooling/build/libs/minimpos-tooling.jar release candidate --subject "$subject" --files "$files"
          else
              if java -jar tooling/build/libs/minimpos-tooling.jar release candidate --subject "$subject" --files "$files" 2> /dev/null &&
                  [[ -z "$(git ls-remote --tags origin "refs/tags/v$name")" ]]; then
                  printf '%s\n' "::error::An unpublished version commit exists. Select resume instead of raising the version again."
                  exit 1
              fi
              java -jar tooling/build/libs/minimpos-tooling.jar release bump "$BUMP"
              name=$(sed -n 's/^versionName=//p' version.properties)
          fi
          if [[ -n "$(git ls-remote --tags origin "refs/tags/v$name")" ]]; then
              printf '%s\n' "::error::Tag v$name already exists"
              exit 1
          fi
          if [[ "$BUMP" != resume ]]; then
              git config user.name "Adam Stiskala"
              git config user.email "github@adamstiskala.com"
              git diff --check
              git diff -- version.properties
              test "$(git diff --name-only)" = version.properties
              git commit --quiet --message "Release $name" version.properties
              auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
              printf '%s\n' "::add-mask::$auth"
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          fi
          {
              printf '%s\n' "commit=$(git rev-parse HEAD)"
              printf '%s\n' "name=$name"
              printf '%s\n' "code=$(sed -n 's/^versionCode=//p' version.properties)"
              printf '%s\n' "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' "Prepared $name at $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Reuse successful exact-commit CI when available
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          gh api --method GET "repos/$REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$COMMIT" -f branch=main -f per_page=100 > "$RUNNER_TEMP/ci-runs.json"
          # Try successful runs newest first. Missing/expired artifacts require fresh CI, never unverified reuse.
          while :; do
              run=$(java -jar tooling/build/libs/minimpos-tooling.jar release ci --runs "$RUNNER_TEMP/ci-runs.json" \
                  --commit "$COMMIT")
              if [[ "$run" == null ]]; then break; fi
              id=$(jq -r '.id' <<< "$run")
              attempt=$(jq -r '.run_attempt' <<< "$run")
              artifact="$RUNNER_TEMP/reuse-$id-$attempt"
              if gh run download "$id" --repo "$REPOSITORY" --name "release-$COMMIT-$attempt" --dir "$artifact"; then
                  # Verification runs the current checkout's tooling, not the downloaded executable.
                  java -jar tooling/build/libs/minimpos-tooling.jar release verify --artifact "$artifact" \
                      --commit "$COMMIT" --run-id "$id" --run-attempt "$attempt"
                  {
                      printf '%s\n' "run=$id"
                      printf '%s\n' "attempt=$attempt"
                  } >> "$GITHUB_OUTPUT"
                  printf '%s\n' "Reusing exact successful CI: $(jq -r '.html_url' <<< "$run")" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
              fi
              jq --arg id "$id" '.workflow_runs |= map(select((.id | tostring) != $id))' \
                  "$RUNNER_TEMP/ci-runs.json" > "$RUNNER_TEMP/remaining-runs.json"
              mv "$RUNNER_TEMP/remaining-runs.json" "$RUNNER_TEMP/ci-runs.json"
          done
          printf '%s\n' "No reusable exact-commit artifact; the full CI workflow will run." >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: prepare
    if: needs.prepare.outputs.run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      run: ${{ steps.artifact.outputs.run }}
      attempt: ${{ steps.artifact.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Verify the checkout
        env:
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Quality gate and release build
        run: |
          MINIMPOS_CHROME="$(command -v google-chrome)"
          export MINIMPOS_CHROME
          scripts/ci

      - name: Prepare unsigned release artifact
        id: artifact
        env:
          COMMIT: ${{ needs.prepare.outputs.commit }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p build/release-artifact
          cp app/build/outputs/apk/release/app-release-unsigned.apk build/release-artifact/
          cp tooling/build/libs/minimpos-tooling.jar build/release-artifact/
          java -jar tooling/build/libs/minimpos-tooling.jar release manifest --artifact build/release-artifact \
              --commit "$COMMIT" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
          {
              printf '%s\n' "run=$RUN_ID"
              printf '%s\n' "attempt=$RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Upload unsigned release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.prepare.outputs.commit }}-${{ github.run_attempt }}
          path: build/release-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            */build/reports/
            */build/test-results/
          retention-days: 14

  release:
    needs: [prepare, ci]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && needs.prepare.outputs.run != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job receives signing secrets; no Gradle plugins or dependencies execute here.
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Download and verify the exact CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          RUN_ID: ${{ needs.prepare.outputs.run || needs.ci.outputs.run }}
          RUN_ATTEMPT: ${{ needs.prepare.outputs.attempt || needs.ci.outputs.attempt }}
        run: |
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name "release-$COMMIT-$RUN_ATTEMPT" \
              --dir "$RUNNER_TEMP/release-artifact"
          java -jar "$RUNNER_TEMP/release-artifact/minimpos-tooling.jar" release verify --artifact "$RUNNER_TEMP/release-artifact" \
              --commit "$COMMIT" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$COMMIT"

      - name: Sign and verify the CI-built APK
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_SIGNING_PROPERTIES: ${{ secrets.RELEASE_SIGNING_PROPERTIES }}
          VERSION: ${{ needs.prepare.outputs.name }}
          CODE: ${{ needs.prepare.outputs.code }}
        run: |
          umask 077
          if [[ -z "$RELEASE_KEYSTORE" ]] || [[ -z "$RELEASE_SIGNING_PROPERTIES" ]]; then
              printf '%s\n' "::error::The release environment needs the RELEASE_KEYSTORE and RELEASE_SIGNING_PROPERTIES secrets"
              exit 1
          fi
          tools=$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          apk="$RUNNER_TEMP/release-artifact/app-release-unsigned.apk"
          "$tools/aapt" dump badging "$apk" |
              grep -F "package: name='app.minimpos' versionCode='$CODE' versionName='$VERSION'"
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf '%s' "$RELEASE_SIGNING_PROPERTIES" > "$RUNNER_TEMP/signing.properties"
          # Use Java's same .properties parser as Gradle; never print or shell-evaluate secret values.
          java -jar "$RUNNER_TEMP/release-artifact/minimpos-tooling.jar" signing "$RUNNER_TEMP"
          "$tools/zipalign" -c -P 16 -v 4 "$apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
              --ks-key-alias "$(cat "$RUNNER_TEMP/keyAlias")" \
              --ks-pass "file:$RUNNER_TEMP/storePassword" --key-pass "file:$RUNNER_TEMP/keyPassword" \
              --out "$RUNNER_TEMP/minimpos-$VERSION.apk" "$apk"
          "$tools/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/minimpos-$VERSION.apk" | grep -v '^WARNING'
          "$tools/zipalign" -c -P 16 -v 4 "$RUNNER_TEMP/minimpos-$VERSION.apk"

      - name: Tag the verified version commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.name }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$COMMIT"
          git config user.name "Adam Stiskala"
          git config user.email "github@adamstiskala.com"
          git tag --annotate "v$VERSION" --message "Mini mPOS $VERSION"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          printf '%s\n' "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "refs/tags/v$VERSION"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.name }}
          RELEASE_NOTES: ${{ inputs.notes }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # The app reads this small metadata asset to compare the release's versionCode with its own.
          java -jar "$RUNNER_TEMP/release-artifact/minimpos-tooling.jar" release update --out "$RUNNER_TEMP/update.json"
          printf '%s\n\n**Full Changelog**: %s/compare/%s...v%s\n' \
              "$RELEASE_NOTES" "$REPOSITORY_URL" "$PREVIOUS_TAG" "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$VERSION" "$RUNNER_TEMP/minimpos-$VERSION.apk" "$RUNNER_TEMP/update.json" \
              --verify-tag --title "Mini mPOS $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Remove signing material
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/signing.properties" \
              "$RUNNER_TEMP/storePassword" "$RUNNER_TEMP/keyAlias" "$RUNNER_TEMP/keyPassword"
